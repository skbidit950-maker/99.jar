name: Build 99 Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build 99 Client
        run: gradle --no-daemon clean build

      - name: Create ZIP
        run: |
          mkdir -p release
          zip -r release/99-client-source.zip . \
            -x ".git/*" ".gradle/*" "build/*" "release/*"

      - name: Copy JAR
        run: |
          cp build/libs/*.jar release/

      - name: Upload ZIP and JAR
        uses: actions/upload-artifact@v4
        with:
          name: 99-client-build
          path: release/
