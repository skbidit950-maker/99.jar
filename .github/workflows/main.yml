
name: 99 Client Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build 99 Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: 99-client
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create source ZIP
        run: |
          zip -r 99-client-source.zip . \
            -x ".git/*" ".gradle/*" "build/*"

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: 99-client-source
          path: 99-client-source.zip
          
