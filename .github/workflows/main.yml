
name: 99 Client - Forge Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Check project files
        run: |
          echo "Checking 99 Client project..."
          ls -la
          test -f build.gradle
          test -f settings.gradle
          test -d src/main/java

      - name: Build Minecraft Forge 1.20.1
        run: gradle --no-daemon clean build

      - name: List generated files
        run: |
          echo "Build output:"
          ls -lah build/libs/

      - name: Upload 99 Client JAR
        uses: actions/upload-artifact@v4
        with:
          name: 99-Client-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create source ZIP
        run: |
          zip -r 99-client-source.zip . \
            -x ".git/*" ".gradle/*" "build/*"

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: 99-Client-Source
          path: 99-client-source.zip
          
